version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: chembl-postgres
    networks:
      - sparknet
    environment:
      POSTGRES_DB: chembl_36
      POSTGRES_USER: chembl
      POSTGRES_PASSWORD: chembl
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - /home/patryk-kuszneruk/environments/wszi-project/spark_airflow/chembl_36/chembl_36_postgresql:/docker-entrypoint-initdb.d:ro

  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    networks:
      - sparknet
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5434:5432"

  airflow:
    image: apache/airflow:2.7.1
    container_name: airflow-standalone
    networks:
      - sparknet
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8081:8080"
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
        airflow webserver &
        airflow scheduler
      "
    depends_on:
      - airflow-postgres
      - postgres

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    networks:
      - sparknet
    ports:
      - '8080:8080'
      - '7077:7077'
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    hostname: spark-master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_UI_PORT: 8080

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    networks:
      - sparknet
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    hostname: spark-worker-1

  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    networks:
      - sparknet
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    hostname: spark-worker-2

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - /home/patryk-kuszneruk/repos/WSzI:/home/jovyan/data
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - PYSPARK_PYTHON=python3
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - postgres
      
volumes:
  pg_data:

networks:
  sparknet:
    driver: bridge